<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Castimofx is offline</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px;
        background: #000; color: #f8fafc;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { width: 100%; max-width: 340px; text-align: center; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
        background: linear-gradient(135deg, #3b82f6, #7c3aed 50%, #f43f5e);
        display: grid; place-items: center;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 22px; font-size: 15px; line-height: 1.5; color: rgba(248, 250, 252, 0.66); }
      button {
        font: inherit; font-weight: 700; font-size: 15px; color: #1c1100; cursor: pointer;
        background: #f59e0b; border: 0; border-radius: 12px; padding: 12px 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" />
        </svg>
      </div>
      <h1>You seem to be offline</h1>
      <p>Castimofx needs an internet connection to show your account. Please check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
